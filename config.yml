# Platform-owned LLM/tool usage metering. Nothing is metered while mode is "off",
# which is the default and a true rollback switch.
usage:
  # off     - no metering, no gating; the spend facade reads LiteLLM as before.
  # observe - meter and evaluate limits, but never block.
  # enforce - meter and reject calls once a limit is exceeded.
  # Quoted because unquoted `off` is boolean false in YAML.
  mode: "off"
  #
  # How long fact rows are kept. Declared now, acted on when retention lands.
  retention_months: 13
  #
  # Months of usage_event partitions created ahead of the current one.
  partition_ahead_months: 1
  #
  # Which backend the usage_* spend RPCs read.
  # auto    - litellm while mode is "off", elitea otherwise
  # litellm - always the legacy LiteLLM tag aggregates
  # elitea  - always the platform's own tables
  spend_source: auto
  #
  # Admission control. A reservation holds an estimate of a call's cost while it runs.
  reservation:
    # Upper bound on one call's estimate, so overspend stays (concurrency x this) + flush lag.
    max_call_cost_usd: 2.0
    # Assumed output length when the request does not declare max_tokens.
    default_output_tokens: 4096
    # Must exceed the proxy's own consumer timeout or a long stream is reaped mid-flight.
    ttl_seconds: 900
  #
  # Write-behind queue and the two background workers.
  redis:
    queue_flush_batch_size: 500
    queue_flush_interval_seconds: 5
    reaper_interval_seconds: 30
    # Lease held by the one replica that drains and reaps; refreshed each tick.
    lease_seconds: 20
  #
  limits:
    # How long an effective limit is cached in-process; the gate reads it per call.
    cache_ttl_seconds: 30
