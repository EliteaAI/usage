# Platform-owned LLM/tool usage metering. Nothing is metered while mode is "off",
# which is the default and a true rollback switch.
usage:
  # off     - no metering, no gating.
  # observe - meter and evaluate limits, but never block.
  # enforce - meter and reject calls once a limit is exceeded.
  # Quoted because unquoted `off` is boolean false in YAML.
  mode: "off"
  #
  # How long fact rows are kept. Declared now, acted on when retention lands.
  retention_months: 13
  #
  # Months of usage_event partitions created ahead of the current one.
  partition_ahead_months: 1
  #
  # Percent-of-limit at which the UI warns, per budget scope. Only in enforce mode.
  warning_thresholds:
    project_pct: 80
    personal_project_pct: 80
    user_pct: 80
  #
  # Write-behind queue and the background drainer.
  redis:
    queue_flush_batch_size: 500
    queue_flush_interval_seconds: 5
    # Lease held by the one replica that drains; refreshed each tick.
    lease_seconds: 20
  #
  limits:
    # How long an effective limit is cached in-process; the gate reads it per call.
    cache_ttl_seconds: 30
